name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle wrapper JAR is not committed in this repo, so CI installs
      # Gradle directly rather than calling ./gradlew. The version here must stay
      # in step with gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-explorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
